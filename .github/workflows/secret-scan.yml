name: secret-scan
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: read # gitleaks-action lists PR commits; private repos 403 without this
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
